name: Build and Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  ci:
    runs-on: [self-hosted, debian]

    environment: produccion

    container:
      image: ggoitea/laravel-ci:13-php8.5

    env:
      REGISTRY: ${{ vars.REGISTRY_HOST }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Configure environment
        run: |
          cp .env.example .env
          php artisan key:generate
      
      - name: clear cache
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Prepare database
        run: |
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --seed --force

      - name: Build frontend
        run: |
          npm run build

      - name: Run tests
        run: |
          php artisan test

      - name: Install dependencies to build production image
        run: |
          composer install \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader

      - name: Build production image
        run: |
          docker build \
            -f docker/Dockerfile.prod \
            -t ${REGISTRY}/${GITHUB_REPOSITORY#*/}:${GITHUB_SHA} \
            -t ${REGISTRY}/${GITHUB_REPOSITORY#*/}:latest \
            .

      - name: Login to private registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
          docker login ${REGISTRY} \
          --username "admin" \
          --password-stdin

      - name: Push production image
        run: |
          docker push ${REGISTRY}/${GITHUB_REPOSITORY#*/}:${GITHUB_SHA}
          docker push ${REGISTRY}/${GITHUB_REPOSITORY#*/}:latest

  deploy:
    needs: ci
    runs-on: [self-hosted, debian]

    environment: produccion

    steps:
      - name: Deploy application
        run: |
          echo "Deploying application to production environment"
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_DEPLOY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # SSH connection options
          SSH_OPTS="-o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 -p ${{ vars.SSH_PORT }}"
          
          # Deployment directory
          STACK_DIR="${{ vars.STACK_PATH }}"
          
          # Docker stack deploy options
          DOCKER_OPTS="--with-registry-auth -c docker-compose.yml"
          
          # Image registry and name
          IMAGE="${{ vars.REGISTRY_HOST }}/${GITHUB_REPOSITORY#*/}:${GITHUB_SHA}"
          
          # Database migration command (runs before stack deploy)
          MIGRATION_CMD="docker run --rm --env-file .env.docker --add-host=host.docker.internal:host-gateway $IMAGE php artisan migrate --seed --force"
          
          # Remote deployment command
          REMOTE_CMD="cd $STACK_DIR && APP_VERSION=${GITHUB_SHA} $MIGRATION_CMD && docker stack deploy $DOCKER_OPTS ${{ vars.STACK_NAME }}"
          
          # Execute deployment
          ssh $SSH_OPTS ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "$REMOTE_CMD"